<!DOCTYPE html>
<html lang="en">
<head>

<title>Go-Slow Danfo</title>

<style>
:root{color-scheme:dark;--navy:#0d1226;--line:#1f3a7a;--yellow:#ffd21f;--ink:#f3f5ff;--page:#05070f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--page);color:var(--ink);font-family:"Nunito","Trebuchet MS",system-ui,sans-serif;display:flex;justify-content:center;overscroll-behavior:none;touch-action:none;user-select:none}
#wrap{position:relative;width:100%;max-width:480px;height:100%}
canvas{width:100%;height:100%;display:block}
#hud{position:absolute;top:12px;left:0;right:0;display:flex;justify-content:center;gap:10px;font-weight:900;font-size:1rem;pointer-events:none}
#hud span{background:#0d1226cc;border:1px solid var(--line);border-radius:999px;padding:6px 14px}
#ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:28px;background:#05070f55;backdrop-filter:blur(2px)}
#card{width:100%;background:var(--navy);border:2px solid var(--line);border-radius:30px;padding:30px 22px 26px;text-align:center;box-shadow:0 18px 50px #000a}
.trophy{position:relative;width:112px;height:112px;margin:0 auto 14px;border-radius:50%;background:#8b5cf6;display:grid;place-items:center;font-size:58px}
.trophy i{position:absolute;right:-2px;bottom:6px;width:38px;height:38px;border-radius:50%;background:#19b27f;color:#fff;font:900 22px/38px "Nunito",sans-serif;font-style:normal}
h1{margin:0 0 10px;font-size:3.1rem;line-height:1;font-weight:900;color:var(--yellow);letter-spacing:-.02em}
